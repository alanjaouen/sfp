# This pipeline is used as template to promote package


name: 'Promote Package'

on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      pathToPackageJson:
        type: string
        required: true
      environment:
        type: string
        required: true
    secrets:
      NPM_TOKEN:
        required: true


jobs:
  promotePackage:
    name: 'promote package'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v2
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: 'Set Git Config'
        run: |
          git config --global user.email "sfpowerkit.ci@dev.azure.com"
          git config --global user.name "sfpowerkitci"

      - name: 'Promote package'
        run: |
          PKG_NAME=$(jq -r ".name" ${{ inputs.pathToPackageJson }})
          PKG_VERSION=$(jq -r ".version" ${{ inputs.pathToPackageJson }})
          npm dist-tag add $PKG_NAME@$PKG_VERSION ${{ inputs.version }}
          # just to be sure, npm does some time skip setting up tags
          npm dist-tag add $PKG_NAME@$PKG_VERSION ${{ inputs.version }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
